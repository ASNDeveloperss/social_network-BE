# render.yaml
services:
  - type: web
    name: auth-service
    env: docker
    region: oregon  # или virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: auth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: auth-service
      - key: JWT_AUDIENCE
        value: microservices-client
    autoDeploy: true

databases:
  - name: auth-db
    databaseName: authdb
    user: authuser
    plan: free
    region: oregon
